services:
  
  sector1:
    build:
      context: .
      dockerfile: ./sector/Dockerfile
    container_name: sector1
    command: ["./sector_bin", "1"]
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"

  sector2:
    build:
      context: .
      dockerfile: ./sector/Dockerfile
    container_name: sector2
    command: ["./sector_bin", "2"]
    volumes:
      - ./data:/app/data
    ports:
      - "5003:5003"
      - "5004:5004"
      - "5005:5005"

  sector3:
    build:
      context: .
      dockerfile: ./sector/Dockerfile
    container_name: sector3
    command: ["./sector_bin", "3"]
    volumes:
      - ./data:/app/data
    ports:
      - "5006:5006"
      - "5007:5007"
      - "5008:5008"

  sector4:
    build:
      context: .
      dockerfile: ./sector/Dockerfile
    container_name: sector4
    command: ["./sector_bin", "4"]
    volumes:
      - ./data:/app/data
    ports:
      - "5009:5009"
      - "5010:5010"
      - "5011:5011"

  company1:
    build:
      context: .
      dockerfile: ./company/Dockerfile
    container_name: company1
    command: ["1"] 
    volumes:
      - ./data:/app/data
    stdin_open: true 
    tty: true        

  company2:
    build:
      context: .
      dockerfile: ./company/Dockerfile
    container_name: company2
    command: ["2"] 
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true

  company3:
    build:
      context: .
      dockerfile: ./company/Dockerfile
    container_name: company3
    command: ["3"] 
    volumes:
      - ./data:/app/data
    stdin_open: true 
    tty: true       

  company4:
    build:
      context: .
      dockerfile: ./company/Dockerfile
    container_name: company4
    command: ["4"]
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true

  drone1:
    build:
      context: .
      dockerfile: ./drone/Dockerfile
    container_name: drone1
    command: ["./drone_bin", "1"]
    volumes:
      - ./data:/app/data
    ports:
      - "5012:5012"
      - "5013:5013"

  drone2:
    build:
      context: .
      dockerfile: ./drone/Dockerfile
    container_name: drone2
    command: ["./drone_bin", "2"]
    volumes:
      - ./data:/app/data
    ports:
      - "5014:5014"
      - "5015:5015"
      
  sensor1:
    build:
      context: .
      dockerfile: ./sensor/Dockerfile
    container_name: sensor1
    command: ["./sensor_bin", "1"]
    volumes:
      - ./data:/app/data
  
  sensor2:
    build:
      context: .
      dockerfile: ./sensor/Dockerfile
    container_name: sensor2
    command: ["./sensor_bin", "2"]
    volumes:
      - ./data:/app/data

  sensor3:
    build:
      context: .
      dockerfile: ./sensor/Dockerfile
    container_name: sensor3
    command: ["./sensor_bin", "3"]
    volumes:
      - ./data:/app/data
    
  sensor4:
    build:
      context: .
      dockerfile: ./sensor/Dockerfile
    container_name: sensor4
    command: ["./sensor_bin", "4"]
    volumes:
      - ./data:/app/data

  interface-server:
    build:
      context: .
      dockerfile: ./interface/Dockerfile.go
    container_name: interface-server
    command: ["./interface_bin"]
    volumes:
      - ./data:/app/data
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"
      
  interface-gui:
    build:
      context: .
      dockerfile: ./interface/Dockerfile.py
    container_name: interface-gui
    command: ["python3", "interface.py"]
    environment:
      - DISPLAY=${DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/app/data
      - ./data/images:/app/data/images
